# The base the top-level kustomization.yaml and the overlays use. Change the
# namespace, the image tag (pin a release, never latest in production) and
# the replica count here or, better, in an overlay. secrets.env must exist
# next to this file (copy secrets.env.example).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: relay

resources:
  - namespace.yaml
  - valkey.yaml
  - relay.yaml

configMapGenerator:
  - name: relay-env
    envs:
      - relay.env

secretGenerator:
  - name: relay-secrets
    envs:
      - secrets.env

images:
  - name: ghcr.io/devfazla/relay-webmail
    newTag: latest

labels:
  - pairs:
      app.kubernetes.io/part-of: relay
    includeSelectors: false
